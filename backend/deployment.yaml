apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: 795694289362.dkr.ecr.us-east-1.amazonaws.com/nginx-demo:latest
        ports:
        - containerPort: 80
